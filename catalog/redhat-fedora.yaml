# Fedora, Rocky, AlmaLinux, CentOS Stream and Bazzite. The entry format is documented in internal/catalog.

- id: fedora-workstation
  name: Fedora Workstation
  category: desktop
  description: Fedora's GNOME desktop live ISO, with current upstream software.
  homepage: https://fedoraproject.org/workstation/
  arch: {amd64: x86_64, arm64: aarch64}
  steps:
    - fetch: https://fedoraproject.org/releases.json
      jq: '.[] | select(.variant == "Workstation" and .arch == $arch and (.link | endswith(".iso"))) | (.link | capture("-(?<v>[0-9]+)-(?<c>[0-9]+\\.[0-9]+)\\.")) as $m | {version, file: (.link | split("/") | last), dir: (.link | sub("[^/]*$"; "")), cks: ("Fedora-Workstation-" + $m.v + "-" + $m.c + "-" + $arch + "-CHECKSUM")}'
      exclude: '(?i)beta|_rc|/test/'
    - fetch: '{dir}{cks}'
      clearsigned: true
      match: '(?m)^SHA256 \({file}\) = (?P<sha256>[0-9a-f]{64})$'
  url: '{dir}{file}'
  keys: [fedora-release]
  fingerprints:
    - 36F612DCF27F7D1A48A835E4DBFCF71C6D9F90A6
    - 4F50A6114CD5C6976A7F1179655A4B02F577861E
    - D924B10D3E810DABDD8B56B596E7E91491211FCE
  notes: >-
    The CHECKSUM files are clearsigned with the Fedora release key. The key file holds the Fedora 44, 45 and 46
    keys, extracted by fingerprint from https://fedoraproject.org/fedora.gpg. The fingerprints are from
    https://fedoraproject.org/security/ (Fedora 44, Fedora 45, and the key listed there as Fedora Rawhide, whose
    user ID is Fedora (46)).

