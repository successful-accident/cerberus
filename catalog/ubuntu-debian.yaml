- id: debian-netinst
  name: Debian netinst
  category: server
  description: Small network installer for Debian stable.
  homepage: https://www.debian.org/CD/netinst/
  arch: {amd64: amd64, arm64: arm64}
  steps:
    - fetch: https://cdimage.debian.org/debian-cd/current/{arch}/iso-cd/SHA512SUMS
      match: '(?m)^(?P<sha512>[0-9a-f]{128})  (?P<file>debian-(?P<version>[\d.]+)-{arch}-netinst\.iso)$'
  url: https://cdimage.debian.org/debian-cd/current/{arch}/iso-cd/{file}
  signature: {type: detached-checksums, url: 'https://cdimage.debian.org/debian-cd/current/{arch}/iso-cd/SHA512SUMS.sign'}
  keys: [debian-cd]
  fingerprints: [DF9B9C49EAA9298432589D76DA87E80D6294BE9B]
  notes: >-
    Key DF9B9C49EAA9298432589D76DA87E80D6294BE9B (Debian CD signing key) was
    downloaded from https://www.debian.org/CD/key-DA87E80D6294BE9B.txt and its
    fingerprint confirmed on https://www.debian.org/CD/verify.

