- id: linuxmint-cinnamon
  name: Linux Mint Cinnamon
  category: desktop
  description: Ubuntu-based desktop with the Cinnamon environment, easy for Windows switchers.
  homepage: https://linuxmint.com/
  arch: {amd64: 64bit}
  steps:
    - fetch: https://ftp.fau.de/mint/iso/stable/
      match: 'href="(?P<version>\d+(?:\.\d+)?)/"'
    - fetch: https://ftp.fau.de/mint/iso/stable/{version}/sha256sum.txt
      match: '(?m)^(?P<sha256>[0-9a-f]{64}) \*(?P<file>linuxmint-(?P<version>[\d.]+)-cinnamon-{arch}\.iso)$'
  url: https://ftp.fau.de/mint/iso/stable/{version}/{file}
  signature: {type: detached-checksums, url: 'https://ftp.fau.de/mint/iso/stable/{version}/sha256sum.txt.gpg'}
  keys: [linuxmint]
  fingerprints: [27DEB15644C6B3CF3BD7D291300F846BA25BAE09]
  notes: >-
    Mirror ftp.fau.de/mint/iso is listed on https://linuxmint.com/mirrors.php.
    The arch token 64bit is Mint's own; Mint publishes no arm64 ISO. Key
    27DEB15644C6B3CF3BD7D291300F846BA25BAE09 (Linux Mint ISO Signing Key) was
    downloaded from https://keys.openpgp.org/vks/v1/by-fingerprint/27DEB15644C6B3CF3BD7D291300F846BA25BAE09
    and its fingerprint confirmed on
    https://linuxmint-installation-guide.readthedocs.io/en/latest/verify.html
    (the page https://linuxmint.com/verify.php redirects to it).

- id: popos
  name: Pop!_OS
  category: desktop
  description: System76's COSMIC desktop distro, 24.04 LTS, for Intel, AMD and arm64 machines.
  homepage: https://system76.com/pop/
  arch: {amd64: amd64, arm64: arm64}
  steps:
    - fetch: https://api.pop-os.org/builds/24.04/generic?arch={arch}
      jq: '{version: (.version + "." + .build), file: (.url | split("/") | last), iso: .url, sha256: .sha_sum}'
  url: '{iso}'
  filename: pop-os_{version}_{arch}_generic.iso
  notes: >-
    The series is pinned to 24.04 in the fetch URL, because Pop!_OS has no
    machine-readable index of releases. The API also answers for 26.04
    (generic and nvidia, amd64 only, build 7), but https://system76.com/pop/
    lists only 24.04 as current; move the pin once that page offers 26.04.
    The channel is generic, which the download page uses for 24.04; the older
    intel channel is stale (build 20 against 29). The version appends the
    build number so a rebuild counts as an update. No signature is published,
    so the sha256 comes from the API over HTTPS.
