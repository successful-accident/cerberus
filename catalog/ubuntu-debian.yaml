# Ubuntu, Kubuntu, Debian, Linux Mint and Pop!_OS. The entry format is
# documented in internal/catalog.

- id: ubuntu-server-lts
  name: Ubuntu Server LTS
  category: server
  description: Long-term-support server installer, five years of updates.
  homepage: https://ubuntu.com/server
  arch: {amd64: amd64}
  steps:
    - fetch: https://releases.ubuntu.com/
      match: 'href="(?P<version>\d[02468]\.04(?:\.\d+)?)/"'
    - fetch: https://releases.ubuntu.com/{version}/SHA256SUMS
      match: '(?m)^(?P<sha256>[0-9a-f]{64}) \*(?P<file>ubuntu-(?P<version>[\d.]+)-live-server-{arch}\.iso)$'
  url: https://releases.ubuntu.com/{version}/{file}
  signature: {type: detached-checksums, url: 'https://releases.ubuntu.com/{version}/SHA256SUMS.gpg'}
  keys: [ubuntu-cdimage]
  fingerprints: [843938DF228D22F7B3742BC0D94AA3F0EFE21092]
  notes: >-
    Key 843938DF228D22F7B3742BC0D94AA3F0EFE21092 (Ubuntu CD Image Automatic
    Signing Key (2012)) was downloaded from
    https://keyserver.ubuntu.com/pks/lookup?op=get&options=mr&search=0x843938DF228D22F7B3742BC0D94AA3F0EFE21092
    and its fingerprint confirmed on
    https://ubuntu.com/tutorials/how-to-verify-ubuntu. It signs the current
    SHA256SUMS.gpg files.

