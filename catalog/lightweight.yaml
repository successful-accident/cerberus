# Lightweight distros. The entry format is documented in internal/catalog.

- id: alpine-virt
  name: Alpine Linux (virt)
  category: lightweight
  description: Alpine with a slimmed-down kernel for virtual machines.
  homepage: https://alpinelinux.org/downloads/
  arch: {amd64: x86_64, arm64: aarch64}
  steps:
    - fetch: https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/{arch}/latest-releases.yaml
      jq: '.[] | select(.flavor == "alpine-virt") | {version, file: .iso, sha256}'
  url: https://dl-cdn.alpinelinux.org/alpine/latest-stable/releases/{arch}/{file}
