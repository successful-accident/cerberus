# Server installers. The entry format is documented in internal/catalog.
# Signatures and pinned fingerprints are added in build phase 3.

- id: ubuntu-server-lts
  name: Ubuntu Server LTS
  category: server
  description: Long-term-support server installer, five years of updates.
  homepage: https://ubuntu.com/server
  arch: {amd64: amd64}
  steps:
    - fetch: https://releases.ubuntu.com/
      match: 'href="(?P<version>\d[02468]\.04(?:\.\d+)?)/"'
    - fetch: https://releases.ubuntu.com/{version}/SHA256SUMS
      match: '(?m)^(?P<sha256>[0-9a-f]{64}) \*(?P<file>ubuntu-(?P<version>[\d.]+)-live-server-{arch}\.iso)$'
  url: https://releases.ubuntu.com/{version}/{file}

- id: debian-netinst
  name: Debian netinst
  category: server
  description: Small network installer for Debian stable.
  homepage: https://www.debian.org/CD/netinst/
  arch: {amd64: amd64, arm64: arm64}
  steps:
    - fetch: https://cdimage.debian.org/debian-cd/current/{arch}/iso-cd/SHA512SUMS
      match: '(?m)^(?P<sha512>[0-9a-f]{128})  (?P<file>debian-(?P<version>[\d.]+)-{arch}-netinst\.iso)$'
  url: https://cdimage.debian.org/debian-cd/current/{arch}/iso-cd/{file}
