# Homelab hypervisors, storage and cluster OSes. The entry format is documented in internal/catalog.

- id: proxmox-ve
  name: Proxmox VE
  category: homelab
  description: Debian-based virtualization platform with KVM, LXC, ZFS and Ceph behind a web UI.
  homepage: https://www.proxmox.com/en/products/proxmox-virtual-environment/overview
  # The arch token is the file name's tail after the version. Proxmox ships the amd64 ISO as
  # proxmox-ve_<ver>.iso and the arm64 ISO as proxmox-ve_<ver>-arm64.iso.
  arch: {amd64: .iso, arm64: -arm64.iso}
  steps:
    - fetch: https://enterprise.proxmox.com/iso/SHA256SUMS
      match: '(?m)^(?P<sha256>[0-9a-f]{64}) [ *](?P<file>proxmox-ve_(?P<version>\d+\.\d+-\d+){arch})$'
  url: https://enterprise.proxmox.com/iso/{file}
  signature: {type: detached-checksums, url: https://enterprise.proxmox.com/iso/SHA256SUMS.asc}
  keys: [proxmox-release]
  fingerprints:
    - 24B30F06ECC1836A4E5EFECBA7BCD1420BFE778E
    - F4E136C67CDCE41AE6DE6FC81140AF8F639E0C39
  notes: >-
    SHA256SUMS.asc holds two detached signatures, one from the Proxmox Trixie Release Key (24B3 0F06 ...) and one
    from the Proxmox Bookworm Release Key (F4E1 36C6 ...); either passes. The key file is the keyring from
    https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg. Its sha256
    (136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45) matches the value that the official page
    https://pve.proxmox.com/wiki/Package_Repositories prints for that keyring. That page gives a checksum, not a
    fingerprint, so the fingerprints are those of the two keys in the verified file. The SHA256SUMS file lists
    old major versions and other Proxmox products too; the version match picks the newest proxmox-ve file.

