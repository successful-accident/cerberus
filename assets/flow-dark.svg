<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 216" width="840" height="216">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0F14"/><stop offset="1" stop-color="#141C25"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#8C96A2" fill-opacity="0.18"/></pattern>
<pattern id="key" x="0" y="12" width="24" height="12" patternUnits="userSpaceOnUse"><path d="M0 11 H20 V1 H6 V8 H15 V4 H10" fill="none" stroke="#D3A257" stroke-width="1.2" stroke-opacity="0.55"/></pattern>
<pattern id="key2" x="0" y="12" width="24" height="12" patternUnits="userSpaceOnUse"><path d="M0 11 H20 V1 H6 V8 H15 V4 H10" fill="none" stroke="#D3A257" stroke-width="1.3" stroke-opacity="0.95"/></pattern>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="840" height="216" rx="8" fill="url(#bg)"/>
<rect width="840" height="216" rx="8" fill="url(#grid)"/>
<path d="M100 64 H740" stroke="#2A3440" stroke-width="2"/>
<circle cx="100" cy="64" r="4" fill="#D3A257"><animate attributeName="cx" values="100;740" dur="6s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.08;0.92;1" dur="6s" begin="0s" repeatCount="indefinite"/></circle>
<circle cx="100" cy="64" r="20" fill="#10161E" stroke="#D3A257" stroke-width="1.6"/><text x="100" y="70" text-anchor="middle" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="17" fill="#ECE5D6">1</text><text x="100" y="110" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#ECE5D6">resolve</text><text text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#8C96A2"><tspan x="100" y="129">find the newest</tspan><tspan x="100" y="144">release upstream</tspan></text><circle cx="260" cy="64" r="20" fill="#10161E" stroke="#D3A257" stroke-width="1.6"/><text x="260" y="70" text-anchor="middle" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="17" fill="#ECE5D6">2</text><text x="260" y="110" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#ECE5D6">download</text><text text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#8C96A2"><tspan x="260" y="129">to a .part file,</tspan><tspan x="260" y="144">resuming if cut off</tspan></text><circle cx="420" cy="64" r="20" fill="#10161E" stroke="#D3A257" stroke-width="1.6"/><text x="420" y="70" text-anchor="middle" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="17" fill="#ECE5D6">3</text><text x="420" y="110" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#ECE5D6">verify</text><text text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#8C96A2"><tspan x="420" y="129">checksum, plus the</tspan><tspan x="420" y="144">distro's signature</tspan></text><circle cx="580" cy="64" r="20" fill="#10161E" stroke="#D3A257" stroke-width="1.6"/><text x="580" y="70" text-anchor="middle" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="17" fill="#ECE5D6">4</text><text x="580" y="110" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#ECE5D6">place</text><text text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#8C96A2"><tspan x="580" y="129">rename it in,</tspan><tspan x="580" y="144">never overwriting</tspan></text><circle cx="740" cy="64" r="20" fill="#10161E" stroke="#D3A257" stroke-width="1.6"/><text x="740" y="70" text-anchor="middle" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="17" fill="#ECE5D6">5</text><text x="740" y="110" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12.5" fill="#ECE5D6">prune</text><text text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#8C96A2"><tspan x="740" y="129">drop versions past</tspan><tspan x="740" y="144">your keep count</tspan></text>
<text x="420" y="181" text-anchor="middle" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-style="italic" font-size="16" fill="#ECE5D6">The old ISO stays until the new one verifies.</text>
<text x="420" y="201" text-anchor="middle" font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="10.5" fill="#E36B45">A failed check deletes the download. Nothing else changes.</text>
</svg>
