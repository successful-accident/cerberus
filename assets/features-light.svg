<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 304" width="840" height="304">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F2E8"/><stop offset="1" stop-color="#ECE3D0"/></linearGradient>
<pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.9" fill="#5C6672" fill-opacity="0.18"/></pattern>
<pattern id="key" x="0" y="12" width="24" height="12" patternUnits="userSpaceOnUse"><path d="M0 11 H20 V1 H6 V8 H15 V4 H10" fill="none" stroke="#98661E" stroke-width="1.2" stroke-opacity="0.55"/></pattern>
<pattern id="key2" x="0" y="12" width="24" height="12" patternUnits="userSpaceOnUse"><path d="M0 11 H20 V1 H6 V8 H15 V4 H10" fill="none" stroke="#98661E" stroke-width="1.3" stroke-opacity="0.95"/></pattern>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="24"/></filter>
<filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="840" height="304" rx="8" fill="url(#bg)"/><rect width="840" height="304" rx="8" fill="url(#grid)"/>
<rect x="10" y="10" width="404" height="136" rx="6" fill="#FBF7EF" fill-opacity="0.85" stroke="#D6CBB5"/><rect x="34" y="10" width="56" height="1.8" fill="#98661E" opacity="0.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="6s" begin="0.0s" repeatCount="indefinite"/></rect><g fill="none" stroke="#98661E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="39" y="44" width="4" height="4"/><path d="M47 46 H61"/><rect x="39" y="52" width="4" height="4"/><path d="M47 54 H61"/><rect x="39" y="60" width="4" height="4"/><path d="M47 62 H61"/></g><text x="80" y="61" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="21" fill="#1C232B">A catalog by use case</text><text font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#5C6672"><tspan x="34" y="96">About 40 distros in nine groups, from</tspan><tspan x="34" y="114">desktops and servers to rescue disks.</tspan><tspan x="34" y="132">Pick yours from a checklist.</tspan></text>
<rect x="426" y="10" width="404" height="136" rx="6" fill="#FBF7EF" fill-opacity="0.85" stroke="#D6CBB5"/><rect x="450" y="10" width="56" height="1.8" fill="#98661E" opacity="0.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="6s" begin="1.5s" repeatCount="indefinite"/></rect><g fill="none" stroke="#98661E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="454" y="43" width="24" height="22" rx="2"/><path d="M454 51 H478"/><circle cx="459" cy="47" r="0.9" fill="#98661E"/><circle cx="469" cy="58" r="5"/><circle cx="469" cy="58" r="1.2"/></g><text x="496" y="61" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="21" fill="#1C232B">Registers in Proxmox</text><text font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#5C6672"><tspan x="450" y="96">On a Proxmox VE host, new ISOs land in</tspan><tspan x="450" y="114">the storage you pick and appear in the</tspan><tspan x="450" y="132">VM wizard. No upload step.</tspan></text>
<rect x="10" y="158" width="404" height="136" rx="6" fill="#FBF7EF" fill-opacity="0.85" stroke="#D6CBB5"/><rect x="34" y="158" width="56" height="1.8" fill="#98661E" opacity="0.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="6s" begin="3.0s" repeatCount="indefinite"/></rect><g fill="none" stroke="#98661E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="50" cy="202" r="11"/><circle cx="50" cy="202" r="14" stroke-dasharray="2 3" stroke-opacity="0.6"/><path d="M45 202 L48.5 206 L56 197"/></g><text x="80" y="209" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="21" fill="#1C232B">Verifies every download</text><text font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#5C6672"><tspan x="34" y="244">Checks each ISO's checksum, and the</tspan><tspan x="34" y="262">distro's signature where there is one,</tspan><tspan x="34" y="280">before the ISO joins the library.</tspan></text>
<rect x="426" y="158" width="404" height="136" rx="6" fill="#FBF7EF" fill-opacity="0.85" stroke="#D6CBB5"/><rect x="450" y="158" width="56" height="1.8" fill="#98661E" opacity="0.4"><animate attributeName="opacity" values="0.4;1;0.4" dur="6s" begin="4.5s" repeatCount="indefinite"/></rect><g fill="none" stroke="#98661E" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M466 190 L476 194 V203 Q476 210 466 214 Q456 210 456 203 V194 Z"/><path d="M466 196 V208 M461 202 H471" stroke-opacity="0.7"/></g><text x="496" y="209" font-family="'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif" font-size="21" fill="#1C232B">Deletes only its own files</text><text font-family="'SF Mono', Menlo, Consolas, 'Courier New', monospace" font-size="12" fill="#5C6672"><tspan x="450" y="244">Never touches ISOs you uploaded, never</tspan><tspan x="450" y="262">removes one a VM still uses, and never</tspan><tspan x="450" y="280">prunes before the new one verifies.</tspan></text>
</svg>
